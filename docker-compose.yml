services:

  api:
    build: .
    container_name: fleet-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb


  mongodb:
    image: mongo:8
    container_name: fleet-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: